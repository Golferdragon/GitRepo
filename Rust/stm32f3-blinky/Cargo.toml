[package]
name = "stm32f3-blinky"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
stm32f3xx-hal = { version = "0.9", features = ["stm32f303xc", "rt"] }

[dependencies.embedded-hal]
version = "0.2"
features = ["unproven"]

[profile.release]
panic = "abort"
